name: Compile check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: test -d "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      # Compile Kotlin + run JVM unit tests only. No cloudflared build, no signing,
      # no APK packaging — this is the fast gate that catches code errors early.
      - name: Compile and unit-test
        run: gradle --no-daemon compileReleaseKotlin testDebugUnitTest
